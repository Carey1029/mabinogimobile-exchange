<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑪奇mobile物資兌換手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky-deco" id="sky-deco" aria-hidden="true">
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="sky-cloud sc1"></div>
  <div class="sky-cloud sc2"></div>
  <div class="sky-cloud sc3"></div>
  <svg class="cloud-bank" viewBox="0 0 1200 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="cloudGradBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9AC2EE" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#CFE7FF" stop-opacity="0.6"/>
      </linearGradient>
      <linearGradient id="cloudGradFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#EFF8FF" stop-opacity="0.92"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
      </linearGradient>
      <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.5"/>
      </filter>
    </defs>
    <path filter="url(#cloudBlur)" d="M0,150 C40,120 70,138 100,120 C130,102 150,128 190,116 C230,104 250,132 300,118 C350,104 370,130 420,120 C470,110 490,136 540,124 C590,112 610,138 660,126 C710,114 730,140 780,128 C830,116 850,142 900,130 C950,118 970,144 1020,132 C1070,120 1090,146 1140,134 C1170,126 1190,140 1200,136 L1200,220 L0,220 Z" fill="url(#cloudGradBack)"/>
    <path filter="url(#cloudBlur)" d="M0,190 C50,165 85,182 120,162 C155,142 180,172 225,158 C270,144 295,174 345,160 C395,146 415,176 465,164 C515,152 535,180 585,168 C635,156 655,184 705,172 C755,160 775,188 830,176 C885,164 905,190 960,178 C1015,166 1035,192 1090,180 C1130,171 1160,183 1200,178 L1200,220 L0,220 Z" fill="url(#cloudGradFront)"/>
  </svg>
  <div class="moon"></div>
  <div class="shooting-star ss1"></div>
  <div class="shooting-star ss2"></div>
  <div class="shooting-star ss3"></div>
</div>

<div class="page">

  <header class="banner">
    <h1 class="game-title">瑪奇<span class="mobile-badge">mobile</span>物資兌換手冊</h1>
    <div class="marquee-wrap">
      <div class="marquee-track">
        <span><span class="mq-a">兌換路線查詢 · 依 NPC 兌換資料自動整理</span><span class="mq-sep">✦</span><span class="mq-b">點選所需或擁有的物品，了解可兌換流程！</span></span>
        <span aria-hidden="true"><span class="mq-a">兌換路線查詢 · 依 NPC 兌換資料自動整理</span><span class="mq-sep">✦</span><span class="mq-b">點選所需或擁有的物品，了解可兌換流程！</span></span>
      </div>
    </div>
  </header>

  <main class="content">

    <section class="controls" aria-label="查詢設定">
      <div class="mode-tabs" role="tablist">
        <button class="mode-tab is-active" data-mode="item" role="tab" aria-selected="true">
          <span class="tab-icon" data-icon="chest"></span>
          <span>我要兌換這個物品</span>
        </button>
        <button class="mode-tab" data-mode="resource" role="tab" aria-selected="false">
          <span class="tab-icon" data-icon="bag"></span>
          <span>我手上有這個資源</span>
        </button>
      </div>

      <p class="reminder-note">
        <span class="reminder-icon" data-icon="info"></span>
        目前僅列出有兌換價值之物品。
      </p>

      <div class="select-wrap">
        <select id="picker-select">
          <option value="">— 請選擇 —</option>
        </select>
        <span class="select-caret" aria-hidden="true"></span>
      </div>
    </section>

    <section id="result-area" class="result-area">
      <div class="empty-state">
        <span class="empty-icon" data-icon="book"></span>
        <p>選擇上方頁籤，並從下拉選單挑一個名稱，<br>手冊會翻開對應的兌換路線。</p>
      </div>
    </section>

    <section id="notes-area" class="notes-area" hidden>
      <h2>其他兌換備註</h2>
      <ul id="notes-list"></ul>
    </section>

  </main>

  <footer class="footer">
    <p id="updated-at">資料載入中…</p>
    <p class="footer-sub">此為非官方工具，若有良善之建議歡迎遊戲內找我留言!</p>
    <p class="footer-credit">創作者：迪恩・四葉草・你的夜夜上線了</p>
  </footer>

</div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
