name: 轉換 Excel 為網頁資料 (data.json)

on:
  push:
    paths:
      - "data.xlsx"
      - "scripts/convert_xlsx_to_json.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install openpyxl

      - name: 執行轉換 (data.xlsx -> data.json)
        run: python scripts/convert_xlsx_to_json.py data.xlsx data.json

      - name: 自動提交更新後的 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.json; then
            echo "data.json 沒有變化，略過提交"
          else
            git add data.json
            git commit -m "自動更新 data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
